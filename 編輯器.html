<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫代碼繪圖與出題編輯器</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .editor-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .tool-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: #f8fafc; cursor: pointer; border-radius: 6px; font-size: 0.85rem; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .preview-canvas { min-height: 260px; background: white; border: 2px dashed #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
    .code-output { width: 100%; height: 180px; font-family: monospace; font-size: 0.85rem; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #0f172a; color: #38bdf8; }
    .param-group { margin-bottom: 12px; }
    .param-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .param-group input, .param-group select { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>

  <div class="editor-layout">
    
    <!-- 左側：圖形參數設定 -->
    <section class="card">
      <h3>🛠️ 向量繪圖模組</h3>
      <div class="tool-tabs">
        <button class="tab-btn active" onclick="switchTab('vt')">物理運動圖</button>
        <button class="tab-btn" onclick="switchTab('geom')">幾何圖形</button>
        <button class="tab-btn" onclick="switchTab('map')">地圖局部標記</button>
      </div>

      <!-- 模組 A: 物理圖形 -->
      <div id="panel-vt" class="tool-panel">
        <div class="param-group">
          <label>圖表類型</label>
          <select id="vt-type" onchange="generateVT()">
            <option value="v-t">速度-時間 (v-t 圖)</option>
            <option value="x-t">位置-時間 (x-t 圖)</option>
            <option value="a-t">加速度-時間 (a-t 圖)</option>
          </select>
        </div>
        <div class="param-group">
          <label>轉折點坐標 (時間t, 數值v)</label>
          <input type="text" id="vt-points" value="0,0; 2,10; 5,10; 8,0" oninput="generateVT()" placeholder="如: 0,0; 2,10; 4,0">
          <small style="color:#64748b;">格式：以分號分隔各點</small>
        </div>
        <div class="param-group">
          <label><input type="checkbox" id="vt-fill" onchange="generateVT()" checked> 塗滿位移面積（積分陰影）</label>
        </div>
      </div>

      <!-- 模組 B: 幾何圖形 -->
      <div id="panel-geom" class="tool-panel hidden">
        <div class="param-group">
          <label>形狀類型</label>
          <select id="geom-type" onchange="generateGeom()">
            <option value="triangle">直角三角形</option>
            <option value="circle">圓形與切線</option>
          </select>
        </div>
        <div class="param-group">
          <label>底邊標記 (a) / 高標記 (b)</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="geom-side-a" value="3" oninput="generateGeom()" placeholder="底">
            <input type="text" id="geom-side-b" value="4" oninput="generateGeom()" placeholder="高">
          </div>
        </div>
        <div class="param-group">
          <label>斜邊標記 (c)</label>
          <input type="text" id="geom-side-c" value="5" oninput="generateGeom()">
        </div>
      </div>

      <!-- 模組 C: 地圖局部標記 -->
      <div id="panel-map" class="tool-panel hidden">
        <div class="param-group">
          <label>焦點區域 (利用 viewBox 局部放大)</label>
          <select id="map-region" onchange="generateMap()">
            <option value="taiwan">臺灣周邊 (東亞)</option>
            <option value="europe">歐洲地中海</option>
            <option value="world">全球全景</option>
          </select>
        </div>
        <div class="param-group">
          <label>標記點位置 (名稱: X, Y)</label>
          <input type="text" id="map-pins" value="甲: 220,130; 乙: 150,180" oninput="generateMap()">
          <small style="color:#64748b;">格式：標記: X,Y; 標記: X,Y</small>
        </div>
      </div>

      <hr style="border:0;border-top:1px solid #e2e8f0;margin:16px 0;">

      <!-- 題目快速組合器 -->
      <div class="param-group">
        <label>題目文字 (Q:)</label>
        <input type="text" id="q-title" value="根據下圖所示，物體在 0~8 秒內的總位移為何？">
      </div>
      <div class="param-group">
        <label>正確答案 (ANS:)</label>
        <input type="text" id="q-ans" value="50 公尺">
      </div>
      <button class="btn btn-primary" onclick="copyFullQuestion()">📋 一鍵複製完整題目 Markdown</button>
    </section>

    <!-- 右側：即時預覽與代碼輸出 -->
    <section class="card">
      <h3>👁️ 即時圖形預覽</h3>
      <div id="canvas-container" class="preview-canvas">
        <!-- SVG 即時注入在此 -->
      </div>

      <h3>💻 自動生成代碼</h3>
      <textarea id="output-code" class="code-output" readonly></textarea>
      <button class="btn btn-outline" style="margin-top:10px;" onclick="copySVGOnly()">僅複製純 SVG 代碼</button>
    </section>

  </div>

  <script>
    let currentSVG = '';

    // 切換分頁
    function switchTab(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tool-panel').forEach(p => p.classList.add('hidden'));
      event.target.classList.add('active');
      document.getElementById(`panel-${mode}`).classList.remove('hidden');

      if (mode === 'vt') generateVT();
      if (mode === 'geom') generateGeom();
      if (mode === 'map') generateMap();
    }

    // 1. 生成物理運動圖 (v-t, x-t, a-t)
    function generateVT() {
      const type = document.getElementById('vt-type').value;
      const pointsStr = document.getElementById('vt-points').value;
      const isFill = document.getElementById('vt-fill').checked;

      // 解析座標
      const pts = pointsStr.split(';').map(p => {
        const [x, y] = p.split(',').map(n => parseFloat(n.trim()) || 0);
        return { x, y };
      });

      const maxT = Math.max(...pts.map(p => p.x), 10);
      const maxV = Math.max(...pts.map(p => p.y), 10);

      // 轉換成 SVG 繪圖像素座標 (寬 320, 高 200, 留邊界)
      const scaleX = (val) => 40 + (val / maxT) * 240;
      const scaleY = (val) => 160 - (val / maxV) * 120;

      let pathD = `M ${scaleX(pts[0].x)} ${scaleY(pts[0].y)}`;
      pts.slice(1).forEach(p => {
        pathD += ` L ${scaleX(p.x)} ${scaleY(p.y)}`;
      });

      let fillD = pathD + ` L ${scaleX(pts[pts.length-1].x)} 160 L ${scaleX(pts[0].x)} 160 Z`;

      currentSVG = `<svg viewBox="0 0 320 200" width="300" height="190" xmlns="http://www.w3.org/2000/svg">
  <!-- 網格與軸線 -->
  <line x1="40" y1="20" x2="40" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="160" x2="300" y2="160" stroke="#334155" stroke-width="2"/>
  <text x="290" y="180" font-size="12" fill="#334155">t (s)</text>
  <text x="15" y="30" font-size="12" fill="#334155">${type}</text>
  
  ${isFill ? `<path d="${fillD}" fill="#93c5fd" opacity="0.4"/>` : ''}
  <path d="${pathD}" fill="none" stroke="#2563eb" stroke-width="3"/>
  
  ${pts.map(p => `<circle cx="${scaleX(p.x)}" cy="${scaleY(p.y)}" r="4" fill="#1d4ed8"/>
  <text x="${scaleX(p.x)-5}" y="175" font-size="10" fill="#64748b">${p.x}</text>
  <text x="18" y="${scaleY(p.y)+4}" font-size="10" fill="#64748b">${p.y}</text>`).join('')}
</svg>`;

      updatePreview();
    }

    // 2. 生成幾何圖形 (直角三角形)
    function generateGeom() {
      const a = document.getElementById('geom-side-a').value;
      const b = document.getElementById('geom-side-b').value;
      const c = document.getElementById('geom-side-c').value;

      currentSVG = `<svg viewBox="0 0 280 200" width="280" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 直角三角形 -->
  <polygon points="50,160 230,160 50,40" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <!-- 垂直直角符號 -->
  <rect x="50" y="145" width="15" height="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- 標註文字 -->
  <text x="135" y="180" font-size="14" fill="#0f172a" text-anchor="middle">${a}</text>
  <text x="30" y="105" font-size="14" fill="#0f172a">${b}</text>
  <text x="150" y="90" font-size="14" fill="#0f172a">${c}</text>
  <!-- 頂點標記 -->
  <text x="35" y="175" font-size="12" fill="#64748b">C</text>
  <text x="35" y="35" font-size="12" fill="#64748b">A</text>
  <text x="240" y="175" font-size="12" fill="#64748b">B</text>
</svg>`;

      updatePreview();
    }

    // 3. 生成地圖標註 (自帶超輕量向量底圖)
    function generateMap() {
      const region = document.getElementById('map-region').value;
      const pinsStr = document.getElementById('map-pins').value;

      let viewBox = "0 0 400 240";
      if (region === 'taiwan') viewBox = "150 80 180 140";
      if (region === 'europe') viewBox = "60 20 180 120";

      const pins = pinsStr.split(';').map(p => {
        const [label, coords] = p.split(':');
        if (!coords) return null;
        const [x, y] = coords.split(',').map(n => parseFloat(n.trim()) || 0);
        return { label: label.trim(), x, y };
      }).filter(Boolean);

      currentSVG = `<svg viewBox="${viewBox}" width="320" height="200" xmlns="http://www.w3.org/2000/svg" style="background:#e0f2fe;">
  <!-- 極簡歐亞大陸向量剪影 (僅數百 bytes) -->
  <path d="M 80,40 Q 120,30 180,50 T 260,80 T 320,120 L 300,160 Q 240,150 180,180 Z" fill="#bbf7d0" stroke="#86efac"/>
  <!-- 標註圖釘 -->
  ${pins.map(p => `
    <g transform="translate(${p.x}, ${p.y})">
      <circle cx="0" cy="0" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <text x="8" y="4" font-size="12" font-weight="bold" fill="#1e293b">${p.label}</text>
    </g>
  `).join('')}
</svg>`;

      updatePreview();
    }

    function updatePreview() {
      document.getElementById('canvas-container').innerHTML = currentSVG;
      document.getElementById('output-code').value = currentSVG;
    }

    // 複製整題 Markdown
    function copyFullQuestion() {
      const q = document.getElementById('q-title').value;
      const ans = document.getElementById('q-ans').value;
      const fullText = `Q: ${q}\n\n${currentSVG}\n\nANS: ${ans}\n---\n`;
      navigator.clipboard.writeText(fullText);
      alert('已複製題目與向量圖形到剪貼簿！可直接貼上至 .md 題庫檔');
    }

    function copySVGOnly() {
      navigator.clipboard.writeText(currentSVG);
      alert('已複製 SVG 繪圖代碼！');
    }

    // 初始化
    window.onload = generateVT;
  </script>
</body>
</html>
